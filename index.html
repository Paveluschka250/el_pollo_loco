<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="icon" href="./assets/icons/favicon.svg" />
    <title>El Pollo Loco</title>
  </head>
  <body onload="init()">
    <h1>El Pollo Loco</h1>
    <canvas id="canvas" width="720" height="480"></canvas>
    
    <!-- Mobile Rotation Overlay -->
    <div id="mobile-rotation-overlay" class="mobile-rotation-overlay">
      <div class="mobile-rotation-content">
        <img src="./assets/icons/smartphone-rotate.svg" alt="Rotate Phone" class="rotation-icon">
        <p class="rotation-text">Bitte drehe dein Handy für das beste Spielerlebnis</p>
      </div>
    </div>
  </body>
  <script src="./models/drawable-object.class.js"></script>
  <script src="./models/movable-object.js"></script>
  <script src="./models/background.class.js"></script>
  <script src="./models/cloud.class.js"></script>
  <script src="./models/bottle.class.js"></script>
  <script src="./models/coin.class.js"></script>
  <script src="./models/chicken.class.js"></script>
  <script src="./models/endboss.class.js"></script>
  <script src="./models/character.class.js"></script>
  <script src="./models/keyboard.class.js"></script>
  <script src="./models/endscreen.class.js"></script>
  <script src="./models/statusbar.class.js"></script>
  <script src="./models/throwable-object.class.js"></script>
  <script src="./models/world.class.js"></script>
  <script src="./models/level.class.js"></script>
  <script src="./js/level.js"></script>
  <script src="./js/game.js"></script>
  
  <script>
    // Mobile Rotation Overlay Logic
    function checkMobileOrientation() {
      const overlay = document.getElementById('mobile-rotation-overlay');
      const isPortrait = window.innerHeight > window.innerWidth;
      const isMobile = window.innerWidth <= 768; // Mobile breakpoint
      
      if (isMobile && isPortrait) {
        overlay.style.display = 'flex';
      } else {
        overlay.style.display = 'none';
      }
    }
    
    // Check on load and resize
    window.addEventListener('load', checkMobileOrientation);
    window.addEventListener('resize', checkMobileOrientation);
    window.addEventListener('orientationchange', () => {
      // Delay to ensure orientation change is complete
      setTimeout(checkMobileOrientation, 100);
    });
  </script>
</html>
