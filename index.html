<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="icon" href="./assets/icons/favicon.svg" />
    <title>El Pollo Loco</title>
  </head>
  <body onload="init()">
    <!-- Main Menu -->
    <div id="main-menu" class="main-menu">
      <div class="menu-content">
        <h1 class="game-title">El Pollo Loco</h1>
        <div class="menu-buttons">
          <button id="start-game-btn" class="menu-button">Spiel Starten</button>
          <button id="how-to-play-btn" class="menu-button">How to Play</button>
          <button id="impressum-btn" class="menu-button">Impressum</button>
        </div>
      </div>
    </div>

    <!-- How to Play Screen -->
    <div id="how-to-play-screen" class="how-to-play-screen" style="display: none;">
      <div class="tutorial-content">
        <h1 class="tutorial-title">How to Play</h1>
        <div class="controls-grid">
          <div class="control-item">
            <div class="control-icon">
              <img src="./assets/icons/left.svg" alt="Left Arrow" class="icon-left">
            </div>
            <div class="control-text">Links Laufen</div>
            <div class="control-image">
              <img src="./assets/img/2_character_pepe/2_walk/W-23.png" alt="Character Left" class="character-left">
            </div>
          </div>
          
          <div class="control-item">
            <div class="control-icon">
              <img src="./assets/icons/right.svg" alt="Right Arrow" class="icon-right">
            </div>
            <div class="control-text">Rechts Laufen</div>
            <div class="control-image">
              <img src="./assets/img/2_character_pepe/2_walk/W-23.png" alt="Character Right" class="character-right">
            </div>
          </div>
          
          <div class="control-item">
            <div class="control-icon">
              <img src="./assets/icons/jump.svg" alt="Up Arrow" class="icon-up">
            </div>
            <div class="control-text">Springen</div>
            <div class="control-image">
              <img src="./assets/img/2_character_pepe/3_jump/J-34.png" alt="Character Jump" class="character-jump">
            </div>
          </div>
          
          <div class="control-item">
            <div class="control-icon">
              <img src="./assets/icons/spacebar.svg" alt="Spacebar" class="icon-space">
            </div>
            <div class="control-text">Flasche Werfen</div>
            <div class="control-image">
              <img src="./assets/img/6_salsa_bottle/bottle_rotation/1_bottle_rotation.png" alt="Bottle" class="bottle-image">
            </div>
          </div>
        </div>
        <button id="back-to-menu-btn" class="menu-button">Zurück zum Menu</button>
      </div>
    </div>

    <!-- Game Canvas (initially hidden) -->
    <div id="game-container" class="game-container" style="display: none;">
      <h1>El Pollo Loco</h1>
      <canvas id="canvas" width="720" height="480"></canvas>
    </div>
    
    <!-- Mobile Rotation Overlay -->
    <div id="mobile-rotation-overlay" class="mobile-rotation-overlay">
      <div class="mobile-rotation-content">
        <img src="./assets/icons/smartphone-rotate.svg" alt="Rotate Phone" class="rotation-icon">
        <p class="rotation-text">Bitte drehe dein Handy für das beste Spielerlebnis</p>
      </div>
    </div>
  </body>
  <script src="./models/drawable-object.class.js"></script>
  <script src="./models/movable-object.js"></script>
  <script src="./models/background.class.js"></script>
  <script src="./models/cloud.class.js"></script>
  <script src="./models/bottle.class.js"></script>
  <script src="./models/coin.class.js"></script>
  <script src="./models/chicken.class.js"></script>
  <script src="./models/endboss.class.js"></script>
  <script src="./models/character.class.js"></script>
  <script src="./models/keyboard.class.js"></script>
  <script src="./models/endscreen.class.js"></script>
  <script src="./models/statusbar.class.js"></script>
  <script src="./models/throwable-object.class.js"></script>
  <script src="./models/world.class.js"></script>
  <script src="./models/level.class.js"></script>
  <script src="./js/level.js"></script>
  <script src="./js/game.js"></script>
  
  <script>
    // Main Menu Logic
    let gameStarted = false;
    let gameWorld = null; // Umbenannt um Konflikt zu vermeiden
    let backgroundMusic = null; // Globale Hintergrundmusik

    function init() {
      // Game wird erst gestartet wenn "Spiel Starten" gedrückt wird
      setupMenuEventListeners();
      setupBackgroundMusic();
    }

    function setupBackgroundMusic() {
      // Hintergrundmusik nur einmal erstellen
      if (!backgroundMusic) {
        backgroundMusic = new Audio("assets/audio/background-music.mp3");
        backgroundMusic.loop = true;
        backgroundMusic.volume = 0.3;
        backgroundMusic.preload = 'auto';
        
        // Musik starten (mit User-Interaktion)
        startBackgroundMusic();
      }
    }

    function startBackgroundMusic() {
      if (!backgroundMusic) return;
      
      // Musik nur starten, wenn der Browser es erlaubt (User-Interaktion erforderlich)
      const playMusic = () => {
        backgroundMusic.play().catch(e => {
          console.log('Musik konnte nicht automatisch gestartet werden:', e);
        });
      };
      
      // Sofort versuchen zu starten
      playMusic();
      
      // Falls das nicht funktioniert, bei erstem Klick starten
      const startOnClick = () => {
        playMusic();
        document.removeEventListener('click', startOnClick);
        document.removeEventListener('keydown', startOnClick);
      };
      
      document.addEventListener('click', startOnClick);
      document.addEventListener('keydown', startOnClick);
    }

    function setupMenuEventListeners() {
      const startGameBtn = document.getElementById('start-game-btn');
      const howToPlayBtn = document.getElementById('how-to-play-btn');
      const impressumBtn = document.getElementById('impressum-btn');
      const backToMenuBtn = document.getElementById('back-to-menu-btn');

      startGameBtn.addEventListener('click', startGame);
      howToPlayBtn.addEventListener('click', showHowToPlay);
      impressumBtn.addEventListener('click', showImpressum);
      backToMenuBtn.addEventListener('click', backToMainMenu);
    }

    function startGame() {
      // Main Menu verstecken
      document.getElementById('main-menu').style.display = 'none';
      
      // Game Container anzeigen
      document.getElementById('game-container').style.display = 'flex';
      
      // Game initialisieren (nur einmal)
      if (!gameStarted) {
        const canvas = document.getElementById("canvas");
        const keyboard = new Keyboard();
        gameWorld = new World(canvas, keyboard, backgroundMusic); // Musik übergeben
        window.world = gameWorld; // Für Endscreen-Kompatibilität
        gameWorld.startGame(); // Spiel starten
        gameStarted = true;
      } else {
        // Game neu starten (wie Retry) wenn bereits gestartet
        if (gameWorld) {
          gameWorld.restartGame(); // Kompletter Neustart statt nur Resume
        }
      }
    }

    function showHowToPlay() {
      // Main Menu verstecken
      document.getElementById('main-menu').style.display = 'none';
      
      // How to Play Screen anzeigen
      document.getElementById('how-to-play-screen').style.display = 'flex';
    }

    function backToMainMenu() {
      // How to Play Screen verstecken
      document.getElementById('how-to-play-screen').style.display = 'none';
      
      // Main Menu anzeigen
      document.getElementById('main-menu').style.display = 'flex';
    }

    function showImpressum() {
      alert(`IMPRESSUM / DATENSCHUTZ:

🎮 EL POLLO LOCO
Ein 2D-Plattformspiel

📧 KONTAKT:
Für Fragen oder Anregungen wende dich an den Entwickler.

🔒 DATENSCHUTZ:
Dieses Spiel speichert keine persönlichen Daten.
Alle Daten werden nur lokal im Browser gespeichert.

🎵 AUDIO:
Alle verwendeten Sounds sind lizenzfrei oder selbst erstellt.

© 2024 El Pollo Loco - Alle Rechte vorbehalten`);
    }

    // Mobile Rotation Overlay Logic
    function checkMobileOrientation() {
      const overlay = document.getElementById('mobile-rotation-overlay');
      const isPortrait = window.innerHeight > window.innerWidth;
      const isMobile = window.innerWidth <= 768; // Mobile breakpoint
      
      if (isMobile && isPortrait) {
        overlay.style.display = 'flex';
      } else {
        overlay.style.display = 'none';
      }
    }
    
    // Check on load and resize
    window.addEventListener('load', checkMobileOrientation);
    window.addEventListener('resize', checkMobileOrientation);
    window.addEventListener('orientationchange', () => {
      // Delay to ensure orientation change is complete
      setTimeout(checkMobileOrientation, 100);
    });
  </script>
</html>
